name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestNitidez-apk
          path: app/build/outputs/apk/debug/app-debug.apk
