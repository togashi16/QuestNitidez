name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong|Could not|^  > |^> [^T]|Unresolved|Duplicate" build.log | grep -v "> Task" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: QuestNitidez-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK en la rama "apk"
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/QuestNitidez.apk
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add QuestNitidez.apk
          git commit -qm "APK compilado"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
